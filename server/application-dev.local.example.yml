# 复制为 application-dev.local.yml 后填写本机开发配置；真实文件已被 Git 忽略。
# 本文件仅为占位模板，提交前不得替换成真实账号、密码或密钥。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/haji_dev?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: "<本机数据库账号>"
    password: "<本机数据库密码>"
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: "<本机 Redis 密码；无密码时留空>"
hahaen:
  auth:
    password-rsa-private-key: "<本机 H5 RSA 私钥；可留空使用开发生成值>"
  cors:
    allowed-origins: http://localhost:5180
  wechat:
    app-id: "<本机小程序 AppID；可留空>"
    app-secret: "<本机小程序 AppSecret；可留空>"
    login-enabled: false
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: "<本机 MinIO Access Key>"
    secret-key: "<本机 MinIO Secret Key>"
    bucket: haji-dev
