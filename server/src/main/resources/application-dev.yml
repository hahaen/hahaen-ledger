server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/haji_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
  flyway:
    enabled: true
    baseline-on-migrate: false
hahaen:
  auth:
    password-rsa-private-key: ${H5_PASSWORD_RSA_PRIVATE_KEY:GENERATE}
  cors:
    allowed-origins: http://localhost:5173
  wechat:
    app-id: local-dev
    app-secret: local-dev
    login-enabled: false
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: root
    secret-key: rootroot
    bucket: haji-dev
logging:
  level:
    root: INFO
    com.hahaen.ledger: INFO
