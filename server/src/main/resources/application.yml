server:
  port: ${SERVER_PORT:8080}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.hahaen.ledger: INFO
spring:
  application:
    name: hahaen-ledger-server
  autoconfigure:
    # Redis DAO 由 SaTokenRedisConfig 统一注册，避免与 sa-token-redis-template 自动 Bean 重复。
    exclude:
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hahaen_ledger}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    baseline-description: ${FLYWAY_BASELINE_DESCRIPTION:haji-initial-baseline}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
sa-token:
  token-name: X-Auth-Token
  timeout: 2592000
  is-concurrent: true
  is-share: false
  is-log: false
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
hahaen:
  timezone: Asia/Shanghai
  auth:
    password-rsa-private-key: ${H5_PASSWORD_RSA_PRIVATE_KEY:GENERATE}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  wechat:
    app-id: ${WECHAT_APP_ID:local-dev}
    app-secret: ${WECHAT_APP_SECRET:local-dev}
    login-enabled: ${WECHAT_LOGIN_ENABLED:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:root}
    secret-key: ${MINIO_SECRET_KEY:root}
    bucket: ${MINIO_BUCKET:haji-dev}
