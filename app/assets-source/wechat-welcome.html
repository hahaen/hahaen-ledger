<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哈记账固定分享文案图</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 500px; height: 400px; overflow: hidden; }
body { display: flex; flex-direction: column; justify-content: center; padding: 34px; background: #f7f8f7; color: #25312e; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
h1 { margin: 0 0 24px; font-size: 42px; font-weight: 700; line-height: 1.35; letter-spacing: -.04em; }
h1 span { color: #278879; }
.copy { margin: 0; color: #66716d; font-size: 18px; line-height: 1.6; white-space: nowrap; }
</style>
<body>
<h1>记录每一笔，<br><span>让生活更清晰</span></h1>
<p class="copy">用 3 秒记下一笔，用 10 秒看懂这个月。</p>
</body>
</html>
