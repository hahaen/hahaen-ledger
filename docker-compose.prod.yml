services:
  haji-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: hahaen/haji-server:prod
    container_name: haji-server
    restart: unless-stopped
    env_file:
      - /home/hahaen/haji-prod.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Dio.netty.noUnsafe=true -Duser.timezone=Asia/Shanghai"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/hahaen/log/haji:/home/hahaen/log/haji
    expose:
      - "8080"
    networks:
      - jenkins_default

networks:
  jenkins_default:
    name: jenkins_default
    external: true
